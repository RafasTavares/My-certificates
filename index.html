<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Rafael Tavares — Certificados</title>
  <style>
    :root {
      --bg: #0f1117;
      --surface: #1a1d27;
      --surface-hover: #22263a;
      --border: #2e3248;
      --accent: #6c63ff;
      --accent-light: #8b85ff;
      --text: #e8eaf6;
      --text-muted: #7b7f9e;
      --tag-bg: #23274a;
      --radius: 12px;
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
    }

    /* ── Header ── */
    header {
      background: linear-gradient(135deg, #1a1d27 0%, #12152a 100%);
      border-bottom: 1px solid var(--border);
      padding: 48px 24px 40px;
      text-align: center;
    }
    header h1 { font-size: clamp(1.8rem, 4vw, 2.8rem); font-weight: 700; letter-spacing: -0.5px; }
    header h1 span { color: var(--accent-light); }
    header p { margin-top: 8px; color: var(--text-muted); font-size: 1rem; }
    .stats { display: flex; justify-content: center; gap: 32px; margin-top: 28px; flex-wrap: wrap; }
    .stat { text-align: center; }
    .stat strong { display: block; font-size: 1.6rem; font-weight: 700; color: var(--accent-light); }
    .stat span { font-size: 0.8rem; color: var(--text-muted); text-transform: uppercase; letter-spacing: 0.5px; }

    /* ── Controls ── */
    .controls {
      max-width: 1100px;
      margin: 32px auto 0;
      padding: 0 24px;
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
      align-items: center;
    }
    .search-wrap { flex: 1; min-width: 220px; position: relative; }
    .search-wrap svg { position: absolute; left: 12px; top: 50%; transform: translateY(-50%); color: var(--text-muted); pointer-events: none; }
    #search {
      width: 100%;
      padding: 10px 12px 10px 38px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 8px;
      color: var(--text);
      font-size: 0.95rem;
      outline: none;
      transition: border-color .2s;
    }
    #search:focus { border-color: var(--accent); }
    #search::placeholder { color: var(--text-muted); }

    .filter-tags { display: flex; flex-wrap: wrap; gap: 8px; }
    .tag {
      padding: 6px 14px;
      border-radius: 999px;
      border: 1px solid var(--border);
      background: var(--tag-bg);
      color: var(--text-muted);
      font-size: 0.82rem;
      cursor: pointer;
      transition: all .2s;
      white-space: nowrap;
    }
    .tag:hover { border-color: var(--accent); color: var(--text); }
    .tag.active { background: var(--accent); border-color: var(--accent); color: #fff; }

    /* ── Count ── */
    .result-count {
      max-width: 1100px;
      margin: 20px auto 0;
      padding: 0 24px;
      color: var(--text-muted);
      font-size: 0.85rem;
    }

    /* ── Grid ── */
    main {
      max-width: 1100px;
      margin: 20px auto 60px;
      padding: 0 24px;
    }

    .category { margin-bottom: 48px; }
    .category-header {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 20px;
      padding-bottom: 12px;
      border-bottom: 1px solid var(--border);
    }
    .category-icon { font-size: 1.4rem; }
    .category-title { font-size: 1.1rem; font-weight: 600; }
    .category-count {
      margin-left: auto;
      font-size: 0.78rem;
      color: var(--text-muted);
      background: var(--tag-bg);
      padding: 3px 10px;
      border-radius: 999px;
      border: 1px solid var(--border);
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
      gap: 16px;
    }

    .card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 20px;
      display: flex;
      flex-direction: column;
      gap: 12px;
      transition: transform .2s, border-color .2s, box-shadow .2s;
      text-decoration: none;
      color: inherit;
    }
    .card:hover {
      transform: translateY(-3px);
      border-color: var(--accent);
      box-shadow: 0 8px 32px rgba(108, 99, 255, 0.15);
    }
    .card-icon {
      width: 40px; height: 40px;
      border-radius: 8px;
      background: linear-gradient(135deg, var(--accent) 0%, #9c63ff 100%);
      display: flex; align-items: center; justify-content: center;
      font-size: 1.1rem;
      flex-shrink: 0;
    }
    .card-title {
      font-size: 0.9rem;
      font-weight: 500;
      line-height: 1.4;
      flex: 1;
    }
    .card-meta {
      display: flex;
      align-items: center;
      gap: 6px;
      color: var(--text-muted);
      font-size: 0.75rem;
    }
    .card-meta svg { flex-shrink: 0; }

    /* empty state */
    .empty {
      display: none;
      text-align: center;
      padding: 80px 24px;
      color: var(--text-muted);
    }
    .empty.visible { display: block; }
    .empty svg { margin-bottom: 16px; opacity: .4; }
    .empty p { font-size: 1rem; }

    /* ── Footer ── */
    footer {
      text-align: center;
      padding: 24px;
      border-top: 1px solid var(--border);
      color: var(--text-muted);
      font-size: 0.8rem;
    }
    footer a { color: var(--accent-light); text-decoration: none; }

    @media (max-width: 600px) {
      .grid { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>

// ── Render ──────────────────────────────────────────────────────────────────

const main = document.getElementById("main");
const filterTags = document.getElementById("filter-tags");
const searchInput = document.getElementById("search");
const resultCount = document.getElementById("result-count");
const emptyState = document.getElementById("empty");
const emptyTerm = document.getElementById("empty-term");

let activeFilter = "all";
let searchTerm = "";

// Build filter tags
data.forEach(cat => {
  const btn = document.createElement("button");
  btn.className = "tag";
  btn.dataset.filter = cat.filter;
  btn.textContent = cat.category.split("—")[0].trim().replace(/^2026 /, "");
  filterTags.appendChild(btn);
});

// Build DOM
function render() {
  main.innerHTML = "";
  let total = 0;
  let visible = 0;

  data.forEach(cat => {
    const filtered = cat.certs.filter(c => {
      const matchFilter = activeFilter === "all" || activeFilter === cat.filter;
      const matchSearch = !searchTerm || c.title.toLowerCase().includes(searchTerm);
      return matchFilter && matchSearch;
    });

    if (filtered.length === 0) return;
    visible += filtered.length;

    const section = document.createElement("section");
    section.className = "category";
    section.innerHTML = `
      <div class="category-header">
        <span class="category-icon">${cat.icon}</span>
        <span class="category-title">${cat.category}</span>
        <span class="category-count">${filtered.length}</span>
      </div>
      <div class="grid" id="grid-${cat.filter}"></div>
    `;
    main.appendChild(section);

    const grid = section.querySelector(".grid");
    filtered.forEach(cert => {
      const a = document.createElement("a");
      a.className = "card";
      a.href = encodeURIPath(cert.file);
      a.target = "_blank";
      a.rel = "noopener noreferrer";
      a.setAttribute("aria-label", `Abrir certificado: ${cert.title}`);
      a.innerHTML = `
        <div class="card-icon">📄</div>
        <div class="card-title">${cert.title}</div>
        ${cert.date ? `<div class="card-meta">
          <svg width="12" height="12" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
            <rect x="3" y="4" width="18" height="18" rx="2" ry="2"/>
            <line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/>
            <line x1="3" y1="10" x2="21" y2="10"/>
          </svg>
          ${cert.date}
        </div>` : ""}
      `;
      grid.appendChild(a);
    });
  });

  // count stats
  total = data.reduce((s, c) => s + c.certs.length, 0);
  document.getElementById("total-count").textContent = total;
  document.getElementById("category-count").textContent = data.length;

  const showing = searchTerm || activeFilter !== "all"
    ? `Exibindo ${visible} de ${total} certificados`
    : `${total} certificados`;
  resultCount.textContent = showing;

  emptyState.classList.toggle("visible", visible === 0);
  emptyTerm.textContent = searchTerm;
}

function encodeURIPath(path) {
  return path.split("/").map(encodeURIComponent).join("/");
}

// ── Events ──────────────────────────────────────────────────────────────────

filterTags.addEventListener("click", e => {
  if (!e.target.matches(".tag")) return;
  document.querySelectorAll(".tag").forEach(t => t.classList.remove("active"));
  e.target.classList.add("active");
  activeFilter = e.target.dataset.filter;
  render();
});

searchInput.addEventListener("input", e => {
  searchTerm = e.target.value.trim().toLowerCase();
  // when searching, reset filter to all
  if (searchTerm) {
    activeFilter = "all";
    document.querySelectorAll(".tag").forEach(t => t.classList.remove("active"));
    document.querySelector("[data-filter='all']").classList.add("active");
  }
  render();
});

render();
</script>
